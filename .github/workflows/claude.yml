name: Claude Code
on:
  issue_comment:
    # `edited` matters as much as `created`: mega-putin acks feedback with a
    # placeholder the moment it picks the work up and rewrites that same
    # comment into the real answer minutes later, so the answer only ever
    # arrives as an edit. Jobs that must not re-fire on an edit pin
    # `github.event.action == 'created'` themselves.
    types: [created, edited]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened, labeled, unlabeled]
  issues:
    types: [opened]

jobs:
  interactive:
    if: |
      (github.event_name == 'issue_comment' &&
       github.event.action == 'created' &&
       contains(github.event.comment.body, '@claude') &&
       (github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR' ||
        github.event.comment.author_association == 'OWNER'))  ||
      (github.event_name == 'pull_request_review_comment' &&
       contains(github.event.comment.body, '@claude') &&
       (github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR' ||
        github.event.comment.author_association == 'OWNER')) ||
      (github.event_name == 'pull_request_review' &&
       contains(github.event.review.body, '@claude') &&
       (github.event.review.author_association == 'MEMBER' ||
        github.event.review.author_association == 'COLLABORATOR' ||
        github.event.review.author_association == 'OWNER'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: megaeth-labs/.github/.github/actions/claude-interactive@main
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "mega-putin"
          extra_allowed_tools: "Bash(cargo:*)"

  pr-review:
    concurrency:
      group: claude-pr-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    if: |
      (github.event_name == 'pull_request' &&
       (github.event.action == 'opened' ||
        github.event.action == 'synchronize' ||
        github.event.action == 'ready_for_review' ||
        github.event.action == 'reopened')) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       github.event.comment.user.login != 'mega-maxwell[bot]' &&
       !contains(github.event.comment.body, 'claude-review:skip'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      actions: read
    steps:
      # Review under the CI app identity rather than the job token: it is what
      # lets the action resolve stale review threads (the shared action gates
      # --resolve-threads on github_identity_token being non-empty).
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.MEGA_MAXWELL_CLIENT_ID }}
          private-key: ${{ secrets.MEGA_MAXWELL_PK }}
          owner: megaeth-labs
          repositories: revm

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || '' }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
          fetch-depth: 1

      - uses: megaeth-labs/.github/.github/actions/claude-pr-review@main
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_identity_token: ${{ steps.app-token.outputs.token }}
          allowed_bots: "mega-putin"
          extra_prompt: |
            ## This repository is a fork of bluealloy/revm

            Read `MEGAETH-FORK.md` and `REVIEW.md` first; their rules take precedence.
            The questions that matter most here:

            - Does the change keep the public API a superset of upstream (rule 1), or is the exception registered?
            - Is MegaETH logic kept out of the fork (rule 2)? A design decision belongs in `mega-evm`, not here.
            - Does every edited upstream file have a row in the "Upstream touch points" table, with a rebase rule that a future rebase can follow?
            - Is `no_std` preserved (no `std::` without a gate, no new default-on `std` dependency)?
            - For a cherry-pick: does the commit message name the upstream commit, and does the diff match it apart from the recorded conflicts?

  label-check:
    if: |
      github.event_name == 'pull_request' &&
      (github.event.action == 'opened' ||
       github.event.action == 'reopened' ||
       github.event.action == 'labeled' ||
       github.event.action == 'unlabeled') &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Debounce
        run: sleep 15

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: megaeth-labs/.github/.github/actions/claude-label-check@main
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "mega-putin"
          extra_prompt: |
            The label conventions of this repository are in the "Labels" section of `MEGAETH-FORK.md`.

  issue-triage:
    if: github.event_name == 'issues'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: megaeth-labs/.github/.github/actions/claude-issue-triage@main
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "mega-putin"
