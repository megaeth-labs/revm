name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the digest and sweep issues instead of writing them"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # Reports what changed upstream in the crates this fork publishes; the digest
  # is the run's job summary. Upstream is fetched directly: no mirror branch is
  # kept, because pushing upstream's workflow files needs a token this job
  # does not have.
  digest:
    name: upstream digest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The digest is also the body of the one open issue titled `Upstream
    # digest`, and every upstream tag past the base gets an issue titled
    # `Sweep <tag>`. Only this job writes issues; the test jobs run third-party
    # actions and keep the read-only token.
    permissions:
      contents: read
      issues: write
    # Issue titles are the only state. A scheduled run and a manual one at the
    # same time would both miss a title and open the issue twice, so they
    # queue.
    concurrency:
      group: nightly-issues
      cancel-in-progress: false
    env:
      # Without it gh picks the repository from the checkout's remotes and
      # prefers the one named `upstream`, which is bluealloy/revm.
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      DRY_RUN: ${{ inputs.dry_run == true }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/bluealloy/revm.git
          git fetch --no-tags upstream +refs/heads/main:refs/remotes/upstream/main
          # Upstream tags land outside refs/tags; the digest and the sweep
          # issues read them from there.
          git fetch --no-tags upstream '+refs/tags/v*:refs/upstream-tags/v*'
      - name: Build the digest
        run: |
          set -euo pipefail
          # Stateless: the job runs daily, so "since the last digest" is the
          # last 25 hours of upstream main (one hour of overlap, nothing lost
          # if a run is late). A manual run shows the same window.
          since="25 hours ago"
          # All twelve published crates, from the table the semver and release
          # workflows read.
          dirs=()
          while read -r crate version dir || [ -n "$crate" ]; do
            case "$crate" in ''|\#*) continue ;; esac
            dirs+=("$dir")
          done < scripts/mega/crates.txt
          commits=$(git log --oneline --since="$since" refs/remotes/upstream/main -- "${dirs[@]}")

          # Upstream tags are reported, never mirrored: the fork's own tag list
          # stays the fork's releases. A tag counts as new when its commit is on
          # upstream main and was made inside the window.
          : > new-tags.txt
          while read -r tag sha; do
            case "$tag" in v[0-9]*) ;; *) continue ;; esac
            if git merge-base --is-ancestor "$sha" refs/remotes/upstream/main &&
               [ -n "$(git log -1 --since="$since" --format=%H "$sha")" ]; then
              echo "$tag" >> new-tags.txt
            fi
          done < <(git for-each-ref refs/upstream-tags --format='%(refname:strip=2) %(objectname)' | sort -V)
          new_tags=$(cat new-tags.txt)

          {
            echo "## Upstream digest"
            echo
            echo "Upstream main at \`$(git rev-parse --short refs/remotes/upstream/main)\`, window: the last 25 hours."
            echo
            echo "### Commits touching the twelve published crates"
            echo
            if [ -n "$commits" ]; then
              printf "\`\`\`\n%s\n\`\`\`\n" "$commits"
            else
              echo "None."
            fi
            echo
            echo "### Upstream tags cut in the window"
            echo
            if [ -n "$new_tags" ]; then
              printf "\`\`\`\n%s\n\`\`\`\n" "$new_tags"
            else
              echo "None."
            fi
          } > digest.md
          cat digest.md >> "$GITHUB_STEP_SUMMARY"
      - name: Update the digest issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="Upstream digest"
          {
            cat digest.md
            echo
            echo "Upstream \`main\` at \`$(git rev-parse refs/remotes/upstream/main)\`."
          } > digest-body.md
          # The run link is the first line and is left out of the comparison
          # below, so a run that finds the same digest writes nothing.
          {
            echo "Written by $RUN_URL. A run that finds a different digest replaces this body; the edit history keeps the earlier ones."
            cat digest-body.md
          } > digest-issue.md
          # The oldest open issue with exactly this title. The listing, not
          # search: the search index lags behind a just-opened issue.
          number=$(gh api --paginate "repos/$GH_REPO/issues?state=open&per_page=100" \
            --jq ".[] | select(.pull_request == null and .title == \"$title\") | .number" | sort -n | sed -n 1p)
          url=${number:+$GITHUB_SERVER_URL/$GH_REPO/issues/$number}
          if [ "$DRY_RUN" = true ]; then
            echo "::group::$title (dry run, not written)"
            cat digest-issue.md
            echo "::endgroup::"
            result="${url:-no open issue}, not written (dry run)"
          elif [ -z "$number" ]; then
            result="$(gh issue create --title "$title" --body-file digest-issue.md), opened"
          elif [ "$(gh api "repos/$GH_REPO/issues/$number" --jq .body | sed 1d)" = "$(cat digest-body.md)" ]; then
            result="$url, already current"
          else
            gh issue edit "$number" --body-file digest-issue.md
            result="$url, rewritten"
          fi
          printf '\nDigest issue: %s.\n' "$result" >> "$GITHUB_STEP_SUMMARY"
      # A sweep issue lists `<previous tag>..<tag>` for a maintainer to
      # classify. The issues are the record: a tag whose `Sweep <tag>` issue
      # exists, open or closed, is skipped, so a rerun or a night without a new
      # tag opens nothing.
      - name: Open sweep issues for new upstream tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base=$(tr -d '[:space:]' < scripts/mega/base.txt)
          git for-each-ref refs/upstream-tags --format='%(refname:strip=2)' | grep -E '^v[0-9]' | sort -V > tags.txt
          if ! grep -qxF "$base" tags.txt; then
            echo "::error::base tag $base from scripts/mega/base.txt is not an upstream tag"
            exit 1
          fi
          # Every issue title, open or closed; the listing, as above.
          gh api --paginate "repos/$GH_REPO/issues?state=all&per_page=100" \
            --jq '.[] | select(.pull_request == null) | .title' > titles.txt
          : > sweep-summary.md
          prev=""
          past_base=false
          while read -r tag; do
            title="Sweep $tag"
            if [ "$past_base" = true ] && ! grep -qxF "$title" titles.txt; then
              from=$(git rev-parse "refs/upstream-tags/$prev^{commit}")
              to=$(git rev-parse "refs/upstream-tags/$tag^{commit}")
              count=$(git rev-list --count "$from..$to")
              {
                echo "Sweep of upstream \`$prev..$tag\` across the whole repository, fixtures, manifests and lockfile included: $count commits, oldest first."
                echo
                echo "| Tag | Commit |"
                echo "|---|---|"
                echo "| \`$prev\` | \`$from\` |"
                echo "| \`$tag\` | \`$to\` |"
                echo
                echo "Record each commit under one disposition below, then tick it: taken (with the fork pull request), candidate (with an owner and a disposition) or excluded (with the reason)."
                echo "The pull request that carries the picks links this issue; a sweep that takes nothing is closed with its classification here."
                echo
                echo "### Commits"
                echo
                if [ "$count" -eq 0 ]; then
                  echo "None."
                else
                  # Subjects go in code spans so upstream's `#123` and `@name`
                  # stay text: as links they would point at this repository's
                  # issues and notify people. GitHub refuses a body over 65536
                  # characters, so a huge range lists what fits and counts the
                  # rest.
                  git log --reverse --format='%H %s' "$from..$to" |
                    awk -v url=https://github.com/bluealloy/revm/commit/ -v range="$prev..$tag" '
                      {
                        subject = substr($0, length($1) + 2)
                        gsub(/`/, "\047", subject)
                        line = sprintf("- [ ] [`%s`](%s%s) `%s`", substr($1, 1, 10), url, $1, subject)
                        if (full || size + length(line) > 60000) { full = 1; rest++; next }
                        size += length(line) + 1
                        print line
                      }
                      END {
                        if (rest) printf "- [ ] %d more commits did not fit here: `git log --reverse --oneline %s`\n", rest, range
                      }'
                fi
                echo
                echo "### Taken"
                echo
                echo "_Commit and the fork pull request that carries it._"
                echo
                echo "### Candidate"
                echo
                echo "_Commit, owner and disposition._"
                echo
                echo "### Excluded"
                echo
                echo "_Commit and reason._"
                echo
                echo "Opened by $RUN_URL."
              } > sweep.md
              if [ "$DRY_RUN" = true ]; then
                echo "::group::$title (dry run, not opened)"
                cat sweep.md
                echo "::endgroup::"
                {
                  echo "<details><summary>$title: $count commits, not opened (dry run)</summary>"
                  echo
                  cat sweep.md
                  echo
                  echo "</details>"
                } >> sweep-summary.md
              else
                url=$(gh issue create --title "$title" --label mega:cherry-pick --body-file sweep.md < /dev/null)
                echo "- [$title]($url): $count commits" >> sweep-summary.md
              fi
            fi
            if [ "$tag" = "$base" ]; then
              past_base=true
            fi
            prev=$tag
          done < tags.txt
          {
            echo
            echo "### Sweep issues"
            echo
            if [ -s sweep-summary.md ]; then
              cat sweep-summary.md
            else
              echo "None opened: every upstream tag past \`$base\` has one."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # The full execution-spec-test suite, including the legacy tests, the
  # debug-assertion `ethtests` profile and the 32-bit target that the pull
  # request workflow leaves out.
  eest-full:
    name: eest ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: release x86_64-unknown-linux-gnu
            cross: false
            args: clean cargo release
          - name: ethtests x86_64-unknown-linux-gnu
            cross: false
            args: clean cargo ethtests
          - name: release i686-unknown-linux-gnu
            cross: true
            args: clean cross release i686-unknown-linux-gnu
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Read the pinned toolchain
        id: rust
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-on-failure: true
      - name: Install cross
        if: ${{ matrix.cross }}
        run: cargo install cross --locked
      - name: Run tests
        run: ./scripts/run-tests.sh ${{ matrix.args }}

  advisories:
    name: advisories
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@6c8f9facfa5047ec02d8485b6bf52b587b7777d1 # v2.0.18
        with:
          command: check advisories
