name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # Reports what changed upstream in the crates this fork publishes; the digest
  # is the run's job summary. Upstream is fetched directly: no mirror branch is
  # kept, because pushing upstream's workflow files needs a token this job
  # does not have.
  digest:
    name: upstream digest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/bluealloy/revm.git
          git fetch --no-tags upstream +refs/heads/main:refs/remotes/upstream/main
      - name: Build the digest
        run: |
          set -euo pipefail
          # Stateless: the job runs daily, so "since the last digest" is the
          # last 25 hours of upstream main (one hour of overlap, nothing lost
          # if a run is late). A manual run shows the same window.
          since="25 hours ago"
          # All twelve published crates, from the table the semver and release
          # workflows read.
          dirs=()
          while read -r crate version dir || [ -n "$crate" ]; do
            case "$crate" in ''|\#*) continue ;; esac
            dirs+=("$dir")
          done < scripts/mega/crates.txt
          commits=$(git log --oneline --since="$since" refs/remotes/upstream/main -- "${dirs[@]}")

          # Upstream tags are reported, never mirrored: the fork's own tag list
          # stays the fork's releases. A tag counts as new when its commit is on
          # upstream main and was made inside the window.
          git fetch --no-tags upstream '+refs/tags/v*:refs/upstream-tags/v*'
          : > new-tags.txt
          while read -r tag sha; do
            case "$tag" in v[0-9]*) ;; *) continue ;; esac
            if git merge-base --is-ancestor "$sha" refs/remotes/upstream/main &&
               [ -n "$(git log -1 --since="$since" --format=%H "$sha")" ]; then
              echo "$tag" >> new-tags.txt
            fi
          done < <(git for-each-ref refs/upstream-tags --format='%(refname:strip=2) %(objectname)' | sort -V)
          new_tags=$(cat new-tags.txt)

          {
            echo "## Upstream digest"
            echo
            echo "Upstream main at \`$(git rev-parse --short refs/remotes/upstream/main)\`, window: the last 25 hours."
            echo
            echo "### Commits touching the twelve published crates"
            echo
            if [ -n "$commits" ]; then
              printf '\`\`\`\n%s\n\`\`\`\n' "$commits"
            else
              echo "None."
            fi
            echo
            echo "### Upstream tags cut in the window"
            echo
            if [ -n "$new_tags" ]; then
              printf '\`\`\`\n%s\n\`\`\`\n' "$new_tags"
            else
              echo "None."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # The full execution-spec-test suite, including the legacy tests, the
  # debug-assertion `ethtests` profile and the 32-bit target that the pull
  # request workflow leaves out.
  eest-full:
    name: eest ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: release x86_64-unknown-linux-gnu
            cross: false
            args: clean cargo release
          - name: ethtests x86_64-unknown-linux-gnu
            cross: false
            args: clean cargo ethtests
          - name: release i686-unknown-linux-gnu
            cross: true
            args: clean cross release i686-unknown-linux-gnu
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Read the pinned toolchain
        id: rust
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-on-failure: true
      - name: Install cross
        if: ${{ matrix.cross }}
        run: cargo install cross --locked
      - name: Run tests
        run: ./scripts/run-tests.sh ${{ matrix.args }}

  advisories:
    name: advisories
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@6c8f9facfa5047ec02d8485b6bf52b587b7777d1 # v2.0.18
        with:
          command: check advisories
